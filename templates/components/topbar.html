<header class="h-16 border-b border-slate-200 px-4 sm:px-8 flex items-center justify-between gap-3 bg-white shadow-sm shrink-0">

    <!-- Current page -->

    <div class="flex items-center space-x-3 min-w-0">

        <h1 class="text-base sm:text-lg font-bold text-[#13223a] flex items-center gap-2 min-w-0">

            <i class="fa-solid fa-id-card text-[#02bc4d]"></i>

            <span class="truncate">{{ page_title|default:"Tu orientación profesional" }}</span>

        </h1>

    </div>

    <div class="lg:hidden shrink-0 relative" data-account-dropdown>
        <button type="button" data-account-toggle aria-expanded="false" aria-controls="mobile-account-menu" aria-label="Abrir opciones de tu cuenta" class="min-h-[44px] flex items-center gap-2 px-2 rounded-lg hover:bg-slate-100 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#008736]">
            <span class="w-8 h-8 rounded-full bg-[#008736] text-white flex items-center justify-center text-xs font-bold">{{ request.user.initials }}</span>
            <i class="fa-solid fa-chevron-down text-xs text-slate-600 transition-transform" data-account-icon aria-hidden="true"></i>
        </button>
        <div id="mobile-account-menu" data-account-panel class="hidden absolute right-0 top-full mt-2 w-64 max-w-[calc(100vw-2rem)] rounded-xl border border-slate-700 bg-[#13223a] p-2 space-y-1 text-xs shadow-xl z-40">
            {% include 'components/account_menu.html' %}
        </div>
    </div>

</header>
