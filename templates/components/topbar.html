<header class="h-16 border-b border-slate-200 px-4 sm:px-8 flex items-center justify-between gap-3 bg-white shadow-sm shrink-0">

    <!-- Current page -->

    <div class="flex items-center space-x-3 min-w-0">

        <h1 class="text-base sm:text-lg font-bold text-[#13223a] flex items-center gap-2 min-w-0">

            <i class="fa-solid fa-id-card text-[#02bc4d]"></i>

            <span class="truncate">{{ page_title|default:"Tu orientación profesional" }}</span>

        </h1>

    </div>

    <form method="POST" action="{% url 'accounts:logout' %}" class="lg:hidden shrink-0">
        {% csrf_token %}
        <button type="submit" class="min-h-[44px] px-3 text-xs font-semibold text-[#13223a] rounded-lg hover:bg-slate-100">Cerrar sesión</button>
    </form>

</header>
